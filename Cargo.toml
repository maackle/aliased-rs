[package]
name = "aliased"
version = "0.1.0"
edition = "2024"
authors = ["Michael Dougherty <maackle.d@gmail.com>"]
description = "Rewrite Debug output to replace long opaque values with short human-friendly aliases."
license = "MIT OR Apache-2.0"
repository = "https://github.com/maackle/aliased"
readme = "README.md"
keywords = ["debug", "logging", "alias", "pretty-print", "testing"]
categories = ["development-tools::debugging", "development-tools::testing"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
regex = "1"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
# Self dev-dep activates `contextual` for tests/doctests/examples without
# requiring `cargo test --features contextual` on the command line.
aliased = { path = ".", default-features = false, features = ["contextual", "tracing"] }
derive_more = { version = "1.0", features = ["full"] }

[features]
default = ["global", "tracing"]

# Exposes trait which implicitly uses a single global `AliasContext`.
global = []

# Exposes trait which requires an explicit `AliasContext` to be passed in.
contextual = []
